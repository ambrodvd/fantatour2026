<!doctype html><html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fantatour 2026™ · Tappa 21</title>
<style>
:root{
  --navy-deep:#0b1e33;
  --navy-mid:#122c4a;
  --navy-light:#1c3f63;
  --yellow:#f4d21c;
  --yellow-deep:#e0b400;
  --ink:#eef3f8;
  --ink-dim:#9fb2c6;
  --line: rgba(255,255,255,0.10);
  --panel: rgba(255,255,255,0.045);
  --panel-strong: rgba(255,255,255,0.08);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:"DejaVu Sans","Helvetica Neue",Arial,sans-serif;
  background:
    radial-gradient(1200px 500px at 15% -10%, rgba(255,255,255,0.06), transparent 60%),
    linear-gradient(180deg,#0a1a2c 0%, #0d2338 35%, #123452 70%, #16466b 100%);
  color:var(--ink);
}
.condensed{ font-family:"DejaVu Sans Condensed","Arial Narrow",sans-serif; }
.stage{ position:relative; width:100%; max-width:1180px; margin:0 auto; padding:36px 40px 44px; overflow:hidden; }
@media(max-width:768px){ .stage{ padding:20px 14px 28px; } }
.mtn-svg{ position:absolute; left:0; bottom:0; width:100%; height:210px; z-index:0; opacity:0.35; }
.header{ position:relative; z-index:2; display:flex; align-items:center; gap:22px; margin-bottom:22px; flex-wrap:wrap; }
.badge{ width:76px; height:76px; border-radius:50%; background:var(--navy-deep); border:4px solid var(--yellow); display:flex; align-items:center; justify-content:center; flex-shrink:0; box-shadow:0 0 0 4px rgba(244,210,28,0.12); }
.badge svg{width:42px;height:42px;}
.header-text .eyebrow{ font-family:"DejaVu Sans Condensed",sans-serif; text-transform:uppercase; letter-spacing:0.14em; font-size:13px; color:var(--yellow); font-weight:700; margin:0 0 4px; }
.header-text h1{ margin:0; font-family:"DejaVu Sans Condensed",sans-serif; font-weight:700; font-size:30px; letter-spacing:0.01em; color:#fff; text-transform:uppercase; }
.header-text .sub{ margin:4px 0 0; font-size:15px; color:var(--ink-dim); }
.sponsor{ margin-left:auto; background:#fff; color:#0b1e33; font-family:"DejaVu Sans Condensed",sans-serif; font-weight:700; letter-spacing:0.03em; font-size:20px; padding:10px 20px; border-radius:6px; display:flex; align-items:center; gap:8px; box-shadow:0 6px 18px rgba(0,0,0,0.25); }
.sponsor .dot{width:10px;height:10px;border-radius:50%;background:var(--yellow-deep);}

/* ===== Tabs ===== */
.tabs{ position:relative; z-index:2; display:flex; flex-wrap:wrap; gap:8px; margin-bottom:22px; }
.tab-btn{
  font-family:"DejaVu Sans Condensed",sans-serif;
  text-transform:uppercase; letter-spacing:0.04em;
  font-size:14px; font-weight:700;
  padding:10px 16px;
  border-radius:8px;
  border:1px solid var(--line);
  background:var(--panel);
  color:var(--ink-dim);
  cursor:pointer;
  transition:background .15s ease, color .15s ease, border-color .15s ease;
}
.tab-btn.active{ background:linear-gradient(90deg,var(--yellow),var(--yellow-deep)); color:#161200; border-color:var(--yellow-deep); }
.tab-panel{ display:none; position:relative; z-index:2; }
.tab-panel.active{ display:block; }

/* ===== Ranking table ===== */
.board{ position:relative; z-index:2; }
.row{ display:grid; grid-template-columns: 46px 1fr auto; align-items:center; column-gap:16px; padding:9px 18px; border-radius:8px; margin-bottom:3px; }
.row.alt{ background:var(--panel); }
.row.leader{ background:linear-gradient(90deg, var(--yellow) 0%, var(--yellow-deep) 100%); color:#161200; box-shadow:0 4px 14px rgba(244,210,28,0.25); margin-bottom:6px; }
.row.leader .pos{color:#161200;} .row.leader .team{color:#161200;} .row.leader .ds{color:#463b00;} .row.leader .pts{color:#161200;}
.pos{ font-family:"DejaVu Sans Condensed",sans-serif; font-weight:700; font-size:19px; color:#fff; text-align:center; }
.team-block{ display:flex; flex-direction:column; min-width:0; }
.team{ font-weight:700; font-size:16.5px; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ds{ font-size:12.5px; color:var(--ink-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.pts-block{ display:flex; align-items:baseline; gap:10px; justify-content:flex-end; flex-wrap:wrap; }
.pts{ font-family:"DejaVu Sans Condensed",sans-serif; font-weight:700; font-size:20px; color:#fff; min-width:52px; text-align:right; }
.pts-totale{ background:var(--yellow) !important; color:#161200 !important; border-radius:6px; padding:2px 10px; min-width:52px; }
.pts-piazz{ background:#2fbf6a !important; color:#052914 !important; border-radius:6px; padding:2px 10px; min-width:52px; }
.pts-extra{ background:#7c5cff !important; color:#fff !important; border-radius:6px; padding:2px 10px; min-width:52px; }
.pts-item{ display:flex; flex-direction:column; align-items:flex-end; }
.pts-label{ font-size:10.5px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:0.06em; }
.split-cols{ display:grid; grid-template-columns: 1fr 1fr; gap:14px 40px; }

/* rider mini rows */
.mini-row{ display:grid; grid-template-columns:26px 1fr auto; padding:5px 10px; font-size:13.5px; border-radius:5px; }
.mini-row.alt{ background:var(--panel); }
.mini-row .mpos{ color:var(--ink-dim); font-weight:700; font-family:"DejaVu Sans Condensed",sans-serif; }
.mini-row .mname{ color:#fff; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.mini-row .mpts{ color:var(--yellow); font-weight:700; text-align:right; }

.panel{ background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px 16px 10px; }
.panel h3{ margin:0 0 10px; font-family:"DejaVu Sans Condensed",sans-serif; text-transform:uppercase; letter-spacing:0.06em; font-size:14px; color:var(--yellow); border-bottom:1px solid var(--line); padding-bottom:8px; }
.section-title{ font-family:"DejaVu Sans Condensed",sans-serif; text-transform:uppercase; letter-spacing:0.08em; font-size:15px; color:var(--yellow); margin:26px 0 12px; padding-bottom:6px; border-bottom:1px solid var(--line); }
.footer-note{ margin-top:22px; font-size:11.5px; color:var(--ink-dim); text-align:right; position:relative; z-index:2; }

/* ===== Tab 1: Ciclisti di Giornata — grid areas ===== */
.ciclisti-grid{
  display:grid;
  grid-template-areas: "top10" "gpm" "gialla" "sprint";
  grid-template-columns: 1fr;
  gap:16px;
}
@media(min-width:769px){
  .ciclisti-grid{
    grid-template-areas:
      "top10 gialla"
      "top10 sprint"
      "gpm   gpm";
    grid-template-columns: 1.2fr 1fr;
  }
}
.area-top10{ grid-area: top10; }
.area-gialla{ grid-area: gialla; }
.area-sprint{ grid-area: sprint; }
.area-gpm{ grid-area: gpm; }
.gpm-grid{ display:grid; grid-template-columns:1fr; gap:12px; }
@media(min-width:769px) and (max-width:1024px){ .gpm-grid{ grid-template-columns:1fr 1fr; } }
@media(min-width:1025px){ .gpm-grid{ grid-template-columns:repeat(4,1fr); } }
.maglia-row{ display:flex; justify-content:space-between; padding:6px 10px; font-size:14px; }
.maglia-row .mgname{ color:#fff; font-weight:700; }
.maglia-row .mgpts{ color:var(--yellow); font-weight:700; }

/* ===== Tab 2: Squadra per Squadra ===== */
.team-grid{ display:grid; grid-template-columns:1fr; gap:14px; position:relative; z-index:2; }
@media(min-width:1025px){ .team-grid{ grid-template-columns:repeat(3, 1fr); } }
.team-card{ background:var(--panel); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
.team-card.leader-card{ border-color:var(--yellow-deep); box-shadow:0 0 0 1px rgba(244,210,28,0.35); }
.team-card-head{ display:flex; justify-content:space-between; align-items:center; padding:10px 14px; background:var(--panel-strong); }
.team-card.leader-card .team-card-head{ background:linear-gradient(90deg,var(--yellow),var(--yellow-deep)); }
.team-card-head .tname{ font-weight:700; font-size:14.5px; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
@media(max-width:1024px){ .team-card-head .tname{ font-size:16px; } }
.team-card.leader-card .tname{ color:#161200; }
.team-card-head .tpts{ font-family:"DejaVu Sans Condensed",sans-serif; font-weight:700; font-size:17px; color:var(--yellow); flex-shrink:0; margin-left:8px; }
@media(max-width:1024px){ .team-card-head .tpts{ font-size:19px; } }
.team-card.leader-card .tpts{ color:#161200; }
.team-card-ds{ font-size:11px; color:var(--ink-dim); padding:6px 14px 0; }
@media(max-width:1024px){ .team-card-ds{ font-size:12.5px; } }
.team-card.leader-card .team-card-ds{ color:rgba(22,18,0,0.65); background:linear-gradient(90deg,var(--yellow),var(--yellow-deep)); padding-top:4px; padding-bottom:2px;}
.rider-list{ padding:8px 10px 10px; }
.rider-row{ display:flex; justify-content:space-between; gap:8px; font-size:12.5px; padding:2.5px 6px; border-radius:4px; }
@media(max-width:1024px){ .rider-row{ font-size:14.5px; padding:4px 6px; } }
.rider-row:nth-child(even){ background:rgba(255,255,255,0.035); }
.rider-row .rname{ color:#dbe6f0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.rider-row .rpts{ color:var(--yellow); font-weight:700; flex-shrink:0; }
.rider-row.zero .rpts{ color:var(--ink-dim); font-weight:400; }

/* ===== Riepilogo Giornata ===== */
.riep-row{ display:grid; grid-template-columns: 1fr auto; align-items:center; column-gap:10px; padding:9px 18px; border-radius:8px; margin-bottom:3px; }
@media(max-width:768px){ .riep-row{ padding:9px 10px; column-gap:6px; } }
.riep-row.alt{ background:var(--panel); }
.riep-row.leader{ background:linear-gradient(90deg, var(--yellow) 0%, var(--yellow-deep) 100%); color:#161200; box-shadow:0 4px 14px rgba(244,210,28,0.25); margin-bottom:6px; }
.riep-row.leader .team{color:#161200;} .riep-row.leader .ds{color:#463b00;}
.riep-vals{ display:flex; gap:8px; align-items:baseline; }
.riep-vals .pts-item{ min-width:44px; }

/* ===== Select ===== */
.stage-select{
  font-family:"DejaVu Sans Condensed",sans-serif;
  font-size:15px; font-weight:700;
  background:var(--panel-strong);
  color:#fff;
  border:1px solid var(--line);
  border-radius:8px;
  padding:9px 14px;
  margin:0 0 16px;
  width:100%;
  max-width:280px;
}

.menu-back{
  display:inline-block;
  margin-bottom:18px;
  color:var(--yellow);
  text-decoration:none;
  font-family:"DejaVu Sans Condensed",sans-serif;
  font-weight:700;
  font-size:13px;
  text-transform:uppercase;
  letter-spacing:0.06em;
}
</style></head>

/* ---------- TAB SWITCHING ---------- */
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-'+btn.dataset.tab).classList.add('active');
  });
});

/* ---------- TAB 1: CICLISTI DI GIORNATA ---------- */
function renderCiclisti(){
  const c = DATA.ciclisti;
  let top10 = c.top10.map((r,i)=>`<div class="mini-row${i%2? ' alt':''}"><span class="mpos">${r.pos}</span><span class="mname">${esc(r.nome)}</span><span class="mpts">${r.punti}</span></div>`).join('');
  let sprint = c.sprint.map((r,i)=>`<div class="mini-row${i%2? ' alt':''}"><span class="mpos">${r.pos}</span><span class="mname">${esc(r.nome)}</span><span class="mpts">${r.punti}</span></div>`).join('');
  let gpmCards = c.gpm.map((g,gi)=>{
    let rows = g.rows.map((r,i)=>`<div class="mini-row${i%2? ' alt':''}"><span class="mpos">${r.pos}</span><span class="mname">${esc(r.nome) || '—'}</span><span class="mpts">${r.punti}</span></div>`).join('');
    return `<div class="panel"><h3>GPM · Cat. ${g.cat} #${gi+1}</h3>${rows}</div>`;
  }).join('');
  const html = `
  <div class="ciclisti-grid">
    <div class="area-top10 panel"><h3>Top 10 Tappa</h3>${top10}</div>
    <div class="area-gialla panel"><h3>Maglia Gialla</h3>
      <div class="maglia-row"><span class="mgname">${esc(c.maglia_gialla_giornata.nome)}</span><span class="mgpts">${c.maglia_gialla_giornata.punti} pt</span></div>
    </div>
    <div class="area-sprint panel"><h3>Sprint</h3>${sprint}</div>
    <div class="area-gpm">
      <div class="section-title">Gran Premi della Montagna</div>
      <div class="gpm-grid">${gpmCards}</div>
    </div>
  </div>`;
  document.getElementById('tab-ciclisti').innerHTML = html;
}

/* ---------- TAB 2: SQUADRA PER SQUADRA ---------- */
function renderSquadre(){
  const squadre = DATA.squadre;
  const leaderName = DATA.riepilogo.slice().sort((a,b)=>a.pos-b.pos)[0].squadra;
  const cards = squadre.map(t=>{
    const isLeader = t.squadra === leaderName;
    const riders = t.riders.map((r,i)=>`<div class="rider-row${r.punti===0?' zero':''}"><span class="rname">${esc(r.nome)}</span><span class="rpts">${r.punti}</span></div>`).join('');
    return `<div class="team-card${isLeader?' leader-card':''}">
      <div class="team-card-head"><span class="tname">${esc(t.squadra)}</span><span class="tpts">${t.punti_totale}</span></div>
      <div class="team-card-ds">${esc(t.ds)}</div>
      <div class="rider-list">${riders}</div>
    </div>`;
  }).join('');
  document.getElementById('tab-squadre').innerHTML = `<div class="team-grid">${cards}</div>`;
}

/* ---------- TAB 3: RIEPILOGO GIORNATA ---------- */
function renderRiepilogo(){
  const rows = DATA.riepilogo.slice().sort((a,b)=>a.pos-b.pos);
  const html = rows.map((r,i)=>{
    const isLeader = i===0;
    return `<div class="riep-row${isLeader?' leader':(i%2?' alt':'')}">
      <div class="team-block"><span class="team">${esc(r.squadra)}</span><span class="ds">${esc(r.ds)}</span></div>
      <div class="riep-vals">
        <div class="pts-item"><span class="pts">${r.punti_generale}</span><span class="pts-label">Punti</span></div>
        <div class="pts-item"><span class="pts">${r.bonus}</span><span class="pts-label">Bonus</span></div>
        <div class="pts-item"><span class="pts pts-totale">${r.totale_generale}</span><span class="pts-label">Totale</span></div>
        <div class="pts-item"><span class="pts pts-piazz">${r.punti_piazzamento}</span><span class="pts-label">Piazz.</span></div>
      </div>
    </div>`;
  }).join('');
  document.getElementById('tab-riepilogo').innerHTML = `<div class="board">${html}</div>`;
}

/* ---------- TAB 4 & 5: CLASSIFICHE con selettore tappa ---------- */
function renderClassifica(containerId, list, hasExtra){
  const N = 21;
  let options = '';
  for(let n=1;n<=N;n++){ options += `<option value="Tappa ${n}"${n===N?'':''}>Tappa ${n}</option>`; }
  if(hasExtra) options += `<option value="Extra">Extra</option>`;
  options += `<option value="Totale" selected>Totale</option>`;

  const rows = list.map((r,i)=>{
    const isLeader = r.pos===1;
    let labelSpans = '';
    for(let n=1;n<=N;n++){
      labelSpans += `<div class="pts-item stage-item" data-label="Tappa ${n}"><span class="pts">${r.stages[n]}</span><span class="pts-label">Tappa ${n}</span></div>`;
    }
    if(hasExtra){
      labelSpans += `<div class="pts-item stage-item" data-label="Extra"><span class="pts pts-extra">${r.extra}</span><span class="pts-label">Extra</span></div>`;
    }
    labelSpans += `<div class="pts-item stage-item" data-label="Totale"><span class="pts pts-totale">${r.totale}</span><span class="pts-label">Totale</span></div>`;
    return `<div class="row${isLeader?' leader':(i%2?' alt':'')}">
      <div class="pos">${r.pos}</div>
      <div class="team-block"><span class="team">${esc(r.squadra)}</span><span class="ds">${esc(r.ds)}</span></div>
      <div class="pts-block">${labelSpans}</div>
    </div>`;
  }).join('');

  document.getElementById(containerId).innerHTML = `
    <select class="stage-select">${options}</select>
    <div class="board">${rows}</div>`;

  const select = document.querySelector('#'+containerId+' .stage-select');
  const container = document.getElementById(containerId);
  function applyFilter(){
    const val = select.value;
    container.querySelectorAll('.stage-item').forEach(el=>{
      const lbl = el.dataset.label;
      el.style.display = (lbl === 'Totale' || lbl === val) ? '' : 'none';
    });
  }
  select.addEventListener('change', applyFilter);
  applyFilter();
}

renderCiclisti();
renderSquadre();
renderRiepilogo();
renderClassifica('tab-generale', DATA.generale, true);
renderClassifica('tab-punti', DATA.punti, false);
</script>
